# /etc/nginx/sites-available/chatlogi
# ln -s /etc/nginx/sites-available/chatlogi /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name chatlogi.jp www.chatlogi.jp;

    # HTTP → HTTPS リダイレクト
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chatlogi.jp www.chatlogi.jp;

    # SSL（certbot が自動追記）
    ssl_certificate     /etc/letsencrypt/live/chatlogi.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatlogi.jp/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/chatlogi/artifacts/sinjapan/dist/public;
    index index.html;

    # ── API リクエスト → Node.js（ポート8080）へプロキシ ──────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # ── 静的ファイル（フロントエンド）──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA：404 → index.html にフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip圧縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
